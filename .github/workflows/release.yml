# Builds formuls for Linux and Windows on GitHub's machines.
#
# - Push a tag like v0.3.2 (matching VERSION in the build scripts): both are
#   built and attached to a draft GitHub release, to check and publish.
# - Or run it by hand from the Actions tab ("Run workflow"): both are built and
#   kept as downloadable artifacts, with no release.
# - A pull request that changes a build script or this file builds both too,
#   so a broken build shows up before it reaches main.
#
# The macOS build is signed and notarised on your own Mac and added to the
# release by hand; see docs/release.md.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'build-linux.sh'
      - 'build-windows.bat'
      - 'build-plugin-linux.sh'
      - 'build-plugin-windows.bat'
      - 'src/plugin/**'
      - 'src/tools/plugin-probe/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write   # to create the draft release

env:
  JUCE_VERSION: 9.0.1
  FAUST_VERSION: 2.85.9

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read VERSION and check it matches the tag
        run: |
          # The app and plugin scripts each set VERSION; the release file names
          # come from it, so all six must agree.
          get() { sed -n 's/^\(set \)\{0,1\}VERSION="\{0,1\}\([^"]*\)"\{0,1\}$/\2/p' "$1" | tr -d '\r'; }
          v=$(get build-linux.sh)
          for f in build-linux.sh build-macOS.sh build-windows.bat \
                   build-plugin-linux.sh build-plugin-macOS.sh build-plugin-windows.bat; do
            echo "$f: $(get "$f")"
            [ "$(get "$f")" = "$v" ] || { echo "VERSION in $f differs from build-linux.sh ($v)"; exit 1; }
          done
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # JUCE's Linux dependencies (JUCE/docs/Linux Dependencies.md), plus
          # Pd's headers and clang for faust2puredata, cmake for Faust.
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config wget unzip python3 xvfb \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev libgl1-mesa-dev puredata-dev

      - name: Cache Faust
        id: faust-cache
        uses: actions/cache@v4
        with:
          path: ~/faust
          key: faust-${{ env.FAUST_VERSION }}-ubuntu-24.04

      - name: Build Faust ${{ env.FAUST_VERSION }}
        if: steps.faust-cache.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/grame-cncm/faust/releases/download/$FAUST_VERSION/faust-$FAUST_VERSION.tar.gz"
          tar -xzf "faust-$FAUST_VERSION.tar.gz"
          cd "faust-$FAUST_VERSION"
          make -j"$(nproc)"
          make install PREFIX="$HOME/faust"

      - name: Download JUCE ${{ env.JUCE_VERSION }}
        run: |
          wget -q "https://github.com/juce-framework/JUCE/releases/download/$JUCE_VERSION/juce-$JUCE_VERSION-linux.zip"
          unzip -q "juce-$JUCE_VERSION-linux.zip" -d "$HOME"
          ls "$HOME/JUCE"

      - name: Build
        run: |
          export PATH="$HOME/faust/bin:$PATH"
          faust --version | head -1
          # Projucer is a GUI app even when resaving from the command line.
          xvfb-run -a ./build-linux.sh

      - name: Package
        run: tar -czf "formuls-${{ needs.version.outputs.version }}-linux-x64.tar.gz" "formuls-${{ needs.version.outputs.version }}-linux-x64"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: formuls-*-linux-x64.tar.gz

      # The plugins (VST3, LV2) reuse the app folder's pd/ and gui/.
      - name: Build the plugins
        run: xvfb-run -a ./build-plugin-linux.sh

      - name: Check the plugins in a test host
        run: |
          cmake -S src/tools/plugin-probe -B build-probe -DCMAKE_BUILD_TYPE=Release
          cmake --build build-probe -j"$(nproc)"
          for b in formuls.vst3 formuls.lv2; do
            echo "::group::$b"
            # The editor opens in a window on Xvfb; each capture is uploaded.
            PROBE_MIN_PEAK=0.05 PROBE_SHOW_EDITOR=1 PROBE_REQUIRE_EDITOR=1 \
              PROBE_SNAPSHOT="$PWD/plugin-editor-linux-${b#formuls.}.png" \
              xvfb-run -a build-probe/plugin_probe_artefacts/Release/plugin_probe \
              "$PWD/formuls-${{ needs.version.outputs.version }}-linux-x64-plugins/$b" 4 9001
            # MIDI: a note with MIDI IN off must not reach synth 1; after the
            # tablet turns MIDI IN on, one must (its pitch display updates).
            # Times count from the patch's start-up reset (PROBE_READY_ON).
            PROBE_NO_EDITOR=1 PROBE_REALTIME=1 PROBE_READY_ON=/amphasereset1 PROBE_LINGER=5 PROBE_WATCH=/midikeyboard1,/reset1 \
              PROBE_NOTES_AT="1:60,4:67,5:67,6:67" PROBE_GUI_AT="3:/midikeyboard1:1" \
              PROBE_FORBID_GUI="/oscpitchgui1:0.5:3" PROBE_EXPECT_GUI="/oscpitchgui1:3.5:7.5" \
              build-probe/plugin_probe_artefacts/Release/plugin_probe \
              "$PWD/formuls-${{ needs.version.outputs.version }}-linux-x64-plugins/$b" 60 9001
            echo "::endgroup::"
          done

      - name: Show the plugin log
        if: always()
        run: cat ~/.config/formuls/plugin.log || true

      - name: Upload the editor snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-plugin-editor-snapshot
          path: plugin-editor-linux-*.png
          if-no-files-found: ignore

      - name: Package the plugins
        run: tar -czf "formuls-${{ needs.version.outputs.version }}-linux-x64-plugins.tar.gz" "formuls-${{ needs.version.outputs.version }}-linux-x64-plugins"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-plugins
          path: formuls-*-linux-x64-plugins.tar.gz

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download JUCE ${{ env.JUCE_VERSION }}
        shell: bash
        run: |
          curl -sSL -o juce.zip "https://github.com/juce-framework/JUCE/releases/download/$JUCE_VERSION/juce-$JUCE_VERSION-windows.zip"
          7z x -y -o"$USERPROFILE" juce.zip > /dev/null
          ls "$USERPROFILE/JUCE"

      - name: Install Faust ${{ env.FAUST_VERSION }}
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/grame-cncm/faust/releases/download/$env:FAUST_VERSION/Faust-$env:FAUST_VERSION-win64.exe" -OutFile faust-setup.exe
          Start-Process faust-setup.exe -ArgumentList '/S' -Wait
          "C:\Program Files\Faust\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "C:\Program Files\Faust\bin\faust.exe" --version

      - uses: ilammy/msvc-dev-cmd@v1   # a Developer Command Prompt environment

      - name: Build
        shell: cmd
        run: build-windows.bat

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "formuls-${{ needs.version.outputs.version }}-windows-x64" -DestinationPath "formuls-${{ needs.version.outputs.version }}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: formuls-*-windows-x64.zip

      # The plugin (VST3) reuses the app folder's pd\ and gui\.
      - name: Build the plugin
        shell: cmd
        run: build-plugin-windows.bat

      - name: Check the plugin in a test host
        shell: bash
        env:
          # Git Bash rewrites values that look like paths (/amphasereset1 ->
          # C:/Program Files/Git/amphasereset1); the probe's OSC addresses are not.
          MSYS_NO_PATHCONV: "1"
        run: |
          cmake -S src/tools/plugin-probe -B build-probe -A x64
          cmake --build build-probe --config Release
          # Windows runners have a desktop, so the editor opens in a real window.
          PROBE_MIN_PEAK=0.05 PROBE_SHOW_EDITOR=1 PROBE_REQUIRE_EDITOR=1 \
            PROBE_SNAPSHOT="$PWD/plugin-editor-windows.png" \
            build-probe/plugin_probe_artefacts/Release/plugin_probe.exe \
            "$PWD/formuls-${{ needs.version.outputs.version }}-windows-x64-plugins/formuls.vst3" 4 9001
          # MIDI: as on Linux.
          PROBE_NO_EDITOR=1 PROBE_REALTIME=1 PROBE_READY_ON=/amphasereset1 PROBE_LINGER=5 PROBE_WATCH=/midikeyboard1,/reset1 \
            PROBE_NOTES_AT="1:60,4:67,5:67,6:67" PROBE_GUI_AT="3:/midikeyboard1:1" \
            PROBE_FORBID_GUI="/oscpitchgui1:0.5:3" PROBE_EXPECT_GUI="/oscpitchgui1:3.5:7.5" \
            build-probe/plugin_probe_artefacts/Release/plugin_probe.exe \
            "$PWD/formuls-${{ needs.version.outputs.version }}-windows-x64-plugins/formuls.vst3" 60 9001

      - name: Show the plugin log
        if: always()
        shell: bash
        run: cat "$APPDATA/formuls/plugin.log" || true

      - name: Upload the editor snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-plugin-editor-snapshot
          path: plugin-editor-windows.png
          if-no-files-found: ignore

      - name: Package the plugin
        shell: pwsh
        run: Compress-Archive -Path "formuls-${{ needs.version.outputs.version }}-windows-x64-plugins" -DestinationPath "formuls-${{ needs.version.outputs.version }}-windows-x64-plugins.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-plugins
          path: formuls-*-windows-x64-plugins.zip

  release:
    if: github.ref_type == 'tag'
    needs: [version, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      # The app and plugin archives (linux-x64, linux-x64-plugins, windows-x64,
      # windows-x64-plugins), not the editor snapshots.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-x64*"
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "formuls ${{ needs.version.outputs.version }}" \
            --notes "Draft: add the signed macOS zip (docs/release.md), write the notes, then publish."
